<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f3f6f8;font-family:Arial,sans-serif;color:#17212b">
    <div style="max-width:560px;margin:32px auto;background:#ffffff;border:1px solid #dce3e8;padding:28px">
      <p style="margin:0 0 8px;font-size:13px;color:#52616f">Elite System</p>
      <h1 style="margin:0 0 16px;font-size:24px">Confirme seu novo e-mail</h1>
      <p style="margin:0 0 20px;line-height:1.5">
        Confirme que <strong>{{ .NewEmail }}</strong> ser&aacute; o novo e-mail de acesso ao sistema.
      </p>
      <p style="margin:0 0 24px">
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change"
          style="display:inline-block;background:#1f6feb;color:#ffffff;text-decoration:none;padding:11px 16px;border-radius:6px;font-weight:700"
        >Confirmar novo e-mail</a>
      </p>
      <p style="margin:0;line-height:1.5;color:#52616f;font-size:13px">
        Se voc&ecirc; n&atilde;o solicitou a altera&ccedil;&atilde;o, ignore esta mensagem.
      </p>
    </div>
  </body>
</html>
